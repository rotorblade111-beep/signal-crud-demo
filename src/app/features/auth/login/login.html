<main class="mx-auto flex min-h-[65vh] max-w-6xl items-center justify-center px-4 py-10">
  <section class="grid w-full max-w-4xl overflow-hidden rounded-2xl bg-white shadow-xl md:grid-cols-[0.9fr_1.1fr]">
    <div class="hidden flex-col justify-between bg-[#5865f2] p-9 text-white md:flex">
      <div>
        <div class="mb-8 flex items-center gap-3 text-2xl font-bold">
          <span class="grid h-11 w-11 place-items-center rounded-2xl bg-white/15 text-xl">P</span>
          Posthub
        </div>
        <h1 class="text-3xl font-bold leading-tight">Welcome back.</h1>
        <p class="mt-4 leading-relaxed text-indigo-100">Log in to continue exploring and sharing posts.</p>
      </div>
      <p class="text-sm text-indigo-100">Good to have you back.</p>
    </div>

    <div class="p-6 sm:p-9">
      <p class="mb-1 text-sm font-semibold uppercase tracking-widest text-[#5865f2] md:hidden">Posthub</p>
      <h2 class="mb-1 mt-0 text-2xl font-bold text-slate-900">Welcome back!</h2>
      <p class="mb-6 mt-0 text-sm text-slate-500">We're so excited to see you again.</p>
      <form class="flex flex-col gap-4" (submit)="logIn($event)" novalidate>
          <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-700">
            Username
            <input class="rounded-lg border border-slate-300 px-3.5 py-2.5 font-normal outline-none transition-shadow focus:border-[#5865f2] focus:ring-4 focus:ring-[#5865f2]/15" [class]="((loginForm.username().touched() || submitted()) && loginForm.username().invalid()) || usernameError() ? '!border-red-500 ring-4 !ring-red-500/20 focus:!border-red-500 focus:!ring-red-500/20' : ''" type="email" id="login-username" [formField]="loginForm.username" (input)="usernameError.set(null)" autocomplete="username" placeholder="you@example.com" />
            @if (loginForm.username().touched() || submitted()) {
              @for (error of loginForm.username().errors(); track error.kind) {
                <span class="text-xs font-normal text-red-700">{{ error.message }}</span>
              }
            }
            @if (usernameError(); as error) {
              <span class="text-xs font-normal text-red-700" role="alert"></span>
            }
          </label>
          <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-700">
            Password
            <input class="rounded-lg border border-slate-300 px-3.5 py-2.5 font-normal outline-none transition-shadow focus:border-[#5865f2] focus:ring-4 focus:ring-[#5865f2]/15" [class]="((loginForm.password().touched() || submitted()) && loginForm.password().invalid()) || passwordError() ? '!border-red-500 ring-4 !ring-red-500/20 focus:!border-red-500 focus:!ring-red-500/20' : ''" type="password" id="login-password" [formField]="loginForm.password" (input)="passwordError.set(null)" autocomplete="current-password" />
            @if (loginForm.password().touched() || submitted()) {
              @for (error of loginForm.password().errors(); track error.kind) {
                <span class="text-xs font-normal text-red-700">{{ error.message }}</span>
              }
            }
            @if (passwordError(); as error) {
              <span class="text-xs font-normal text-red-700" role="alert">{{ error }}</span>
            }
          </label>
        <a routerLink="/reset-password" class="self-start text-sm font-semibold text-[#4752c4] no-underline hover:underline">Forgot your password?</a>
        <button type="submit" class="cursor-pointer rounded-lg bg-[#5865f2] px-4 py-3 font-semibold text-white transition-colors hover:bg-[#4752c4]">Log In</button>
      </form>

      <p class="mb-0 mt-5 text-sm text-slate-600">
        Don't have an account?
        <a routerLink="/sign-up" class="font-semibold text-[#4752c4] no-underline hover:underline">Sign Up.</a>
      </p>
    </div>
  </section>
</main>
