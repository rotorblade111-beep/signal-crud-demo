<li class="flex flex-col gap-3 rounded-lg border border-slate-100 bg-slate-50 px-[18px] py-[14px] transition duration-150 hover:-translate-y-0.5 hover:shadow-md sm:flex-row sm:items-start sm:justify-between">
  <div class="min-w-0">
    <h2 class="m-0 text-[0.95rem] font-semibold text-slate-800">
      <a
        [routerLink]="['/view-post', post().id]"
        class="text-inherit no-underline hover:text-blue-700 hover:underline">
        <span class="mr-2 text-[0.85rem] font-normal text-slate-400">#{{ post().id }}</span>{{ titleDisplay() }}
      </a>
    </h2>
    <p class="mb-0 mt-2 whitespace-pre-wrap break-words text-sm leading-relaxed text-slate-600">{{ post().body }}</p>
  </div>
  <div class="flex shrink-0 gap-2">
    <button
      class="cursor-pointer rounded-lg bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-600 transition-colors active:scale-[0.98] hover:bg-slate-200 hover:text-slate-800"
      (click)="onEdit()">
      Edit
    </button>
    <button
      class="cursor-pointer rounded-lg bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-600 transition-colors active:scale-[0.98] hover:bg-red-100"
      (click)="onDelete()">
      Delete
    </button>
  </div>
</li>
