<li class="flex items-center justify-between rounded-lg border border-slate-100 bg-slate-50 px-[18px] py-[14px] transition duration-150 hover:-translate-y-0.5 hover:shadow-md">
  <span class="text-[0.95rem] font-medium text-slate-800">
    <span class="mr-2 text-[0.85rem] text-slate-400">#{{ post().id }}</span> {{ titleDisplay() }}
  </span>
  <div class="flex gap-2">
    <button
      class="cursor-pointer rounded-lg bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-600 transition-colors active:scale-[0.98] hover:bg-slate-200 hover:text-slate-800"
      (click)="onEdit()">
      Edit
    </button>
    <button
      class="cursor-pointer rounded-lg bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-600 transition-colors active:scale-[0.98] hover:bg-red-100"
      (click)="onDelete()">
      Delete
    </button>
  </div>
</li>
