<main class="mx-auto my-10 max-w-[680px] rounded-xl bg-white p-6 font-sans text-slate-800 shadow-[0_4px_20px_rgba(0,0,0,0.05)] [view-transition-name:page]">
  @if (isLoading()) {
    <p class="text-slate-500" role="status">Loading post...</p>
  } @else if (post(); as currentPost) {
    <article>
      <p class="mb-2 text-sm text-slate-500">Post #{{ currentPost.id }}</p>
      <h1 class="mb-4 mt-0 text-2xl font-bold text-slate-900">{{ currentPost.title }}</h1>
      <p class="whitespace-pre-wrap break-words leading-relaxed text-slate-700">{{ currentPost.body }}</p>
    </article>
  } @else {
    <h1 class="mb-4 mt-0 text-2xl font-bold text-slate-900">Post unavailable</h1>
    <p class="text-red-700" role="alert">{{ errorMessage() ?? 'Post not found.' }}</p>
  }

  <a
    routerLink="/home"
    class="mt-6 inline-block rounded-lg bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-700 no-underline transition-colors hover:bg-slate-200">
    Return to posts
  </a>
</main>
