<nav class="mt-5 flex flex-wrap items-center justify-center gap-2" aria-label="Post list pages">
  <app-tooltip
    [text]="previousTooltipText()"
    [disabled]="!isPreviousDisabled()"
    position="top">
    <button
      type="button"
      class="cursor-pointer rounded-lg bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-200 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="isPreviousDisabled()"
      (click)="goToPage(currentPage() - 1)">
      Previous
    </button>
  </app-tooltip>
  @for (page of pageNumbers(); track page) {
    <button
      type="button"
      class="cursor-pointer rounded-lg px-3 py-2 text-sm font-semibold transition-colors"
      [class.bg-blue-600]="page === currentPage()"
      [class.text-white]="page === currentPage()"
      [class.bg-slate-100]="page !== currentPage()"
      [class.text-slate-700]="page !== currentPage()"
      [attr.aria-current]="page === currentPage() ? 'page' : null"
      [attr.aria-label]="'Page ' + page"
      (click)="goToPage(page)">
      {{ page }}
    </button>
  }
  <app-tooltip
    [text]="nextTooltipText()"
    [disabled]="!isNextDisabled()"
    position="top">
    <button
      type="button"
      class="cursor-pointer rounded-lg bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-200 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="isNextDisabled()"
      (click)="goToPage(currentPage() + 1)">
      Next
    </button>
  </app-tooltip>
</nav>
