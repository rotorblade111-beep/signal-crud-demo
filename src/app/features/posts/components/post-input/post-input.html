<label class="flex flex-col gap-2 text-sm font-semibold text-slate-700">
  Title
  <input
    class="box-border w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-[0.95rem] font-normal outline-none transition focus:border-[#5865f2] focus:ring-4 focus:ring-[#5865f2]/15"
    [class]="(fields().title().touched() || submitted()) && fields().title().invalid() ? '!border-red-500 ring-4 !ring-red-500/20 focus:!border-red-500 focus:!ring-red-500/20' : ''"
    type="text"
    id="post-title"
    [formField]="fields().title"
    placeholder="Enter post title..." />
  @if ((fields().title().touched() || submitted()) && fields().title().getError('required')) {
    <span class="text-xs font-normal text-red-700">{{ fields().title().getError('required')?.message }}</span>
  }
</label>
<label class="flex flex-col gap-2 text-sm font-semibold text-slate-700">
  Post body
  <textarea
    class="box-border min-h-32 w-full resize-y rounded-lg border border-slate-200 px-3.5 py-2.5 text-[0.95rem] font-normal leading-relaxed outline-none transition focus:border-[#5865f2] focus:ring-4 focus:ring-[#5865f2]/15"
    [class]="(fields().body().touched() || submitted()) && fields().body().invalid() ? '!border-red-500 ring-4 !ring-red-500/20 focus:!border-red-500 focus:!ring-red-500/20' : ''"
    id="post-body"
    [formField]="fields().body"
    placeholder="Enter post body..."
    rows="6"></textarea>
  @if ((fields().body().touched() || submitted()) && fields().body().getError('required')) {
    <span class="text-xs font-normal text-red-700">{{ fields().body().getError('required')?.message }}</span>
  }
</label>
