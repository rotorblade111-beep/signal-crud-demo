<input
  type="text"
  class="box-border w-full rounded-lg border border-slate-200 px-3.5 py-2.5 text-[0.95rem] outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15"
  [ngModel]="title()"
  (ngModelChange)="title.set($event)"
  [ngModelOptions]="{ standalone: true }"
  placeholder="Enter post title..."
/>
<textarea
  class="box-border min-h-24 w-full resize-y rounded-lg border border-slate-200 px-3.5 py-2.5 text-[0.95rem] outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15"
  [ngModel]="body()"
  (ngModelChange)="body.set($event)"
  [ngModelOptions]="{ standalone: true }"
  placeholder="Enter post body..."
  rows="3"
></textarea>
