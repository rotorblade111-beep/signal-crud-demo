<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
  <section
    class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirmation-message">
    <p id="confirmation-message" class="m-0 text-base leading-relaxed text-slate-800">
      {{ message() }}
    </p>
    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-blue-700"
        (click)="confirmed.emit()">
        Yes
      </button>
      <button
        type="button"
        class="cursor-pointer rounded-lg bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-200"
        (click)="cancelled.emit()">
        No
      </button>
    </div>
  </section>
</div>
