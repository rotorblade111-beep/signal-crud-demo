<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto grid max-w-7xl grid-cols-1 items-center gap-4 px-5 py-4 md:grid-cols-[1fr_auto_1fr]">
    <!-- Logo (Left) -->
    <a [routerLink]="auth.currentUser() ? '/home' : '/login'" aria-label="Posthub home" class="mx-auto flex items-center gap-2.5 text-xl font-bold tracking-tight text-slate-900 no-underline md:mx-0">
      <svg class="h-9 w-9 text-blue-600" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="34" height="34" rx="11" fill="currentColor" />
        <path d="M13 12.5h9.5a5.5 5.5 0 0 1 0 11H18v5h-5V12.5Zm5 4.5v2h4.5a1 1 0 1 0 0-2H18Z" fill="white" />
      </svg>
      <span>Posthub</span>
    </a>

    <!-- Main Navigation (Center) -->
    <nav aria-label="Main navigation" class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-sm font-medium">
      @if (auth.currentUser()) {
        <a routerLink="/home" class="text-slate-700 no-underline transition-colors hover:text-blue-700">Home</a>
        <a
          [routerLink]="['/personal', auth.currentUser()!.id]"
          class="text-slate-700 no-underline transition-colors hover:text-blue-700">
          Personalized Feed
        </a>
      }
      <a href="#" (click)="$event.preventDefault()" class="text-slate-700 no-underline transition-colors hover:text-blue-700">FAQ</a>
      <a href="#" (click)="$event.preventDefault()" class="text-slate-700 no-underline transition-colors hover:text-blue-700">Contact</a>
    </nav>

    <!-- Auth Actions (Right / End) -->
    <div class="relative flex items-center justify-end text-sm font-medium">
      @if (auth.currentUser()) {
        <button
          type="button"
          class="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-slate-700 transition-colors hover:border-blue-200 hover:bg-blue-50 hover:text-blue-700"
          aria-label="Open account menu"
          aria-controls="account-menu"
          [attr.aria-expanded]="isMenuOpen()"
          (click)="toggleMenu()">
          <span class="max-w-40 truncate">{{ auth.currentUser()!.email }}</span>
          <svg
            class="h-4 w-4 transition-transform duration-200"
            [class.rotate-180]="isMenuOpen()"
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true">
            <path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div
          id="account-menu"
          class="absolute right-0 top-full z-50 mt-2 w-52 origin-top-right rounded-xl border border-slate-200 bg-white p-2 shadow-lg transition duration-200 ease-out"
          [class.pointer-events-none]="!isMenuOpen()"
          [class.translate-y-[-0.5rem]]="!isMenuOpen()"
          [class.scale-95]="!isMenuOpen()"
          [class.opacity-0]="!isMenuOpen()"
          [attr.aria-hidden]="!isMenuOpen()"
          [attr.inert]="!isMenuOpen() ? '' : null"
          (click)="$event.stopPropagation()">
          <a
            routerLink="/profile"
            class="block w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-700 no-underline transition-colors hover:bg-blue-50 hover:text-blue-700"
            (click)="closeMenu()">
            Profile
          </a>
          <div class="my-1 border-t border-slate-100"></div>
          <button
            type="button"
            class="w-full cursor-pointer rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-700 transition-colors hover:bg-red-50 hover:text-red-700"
            (click)="logOut()">
            Logout
          </button>
        </div>
      } @else if (!isAuthPage()) {
        <a routerLink="/login" class="text-slate-700 no-underline transition-colors hover:text-blue-700">Sign UP/Login</a>
      }
    </div>
  </div>
</header>
